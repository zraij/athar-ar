<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1740">
<title>ملزمة الأحياء — الفصل الأول: الخلية | أثر أكاديمي</title>
<link rel="stylesheet" href="../../fonts/cairo.css">
<style>
  :root{--p:#5b2a86;--p2:#8e44ad;--ink:#2a1740;--gold:#f2c230;--gr:#0f8b6d;--soft:#f6f0fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#f4eef9;font-family:Cairo,system-ui,sans-serif;color:var(--ink)}
  button,a{font-family:inherit}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#2a1740,#5b2a86 60%,#0f8b6d 140%);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 var(--gold)}
  header .brand{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;opacity:.9;white-space:nowrap}
  header .brand i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
  header .tt{flex:1;min-width:0}
  header .tt b{display:block;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .tt span{font-size:12px;opacity:.8}
  header .pg{background:var(--gold);color:var(--ink);border-radius:12px;padding:3px 10px;font-weight:800;font-size:14px;white-space:nowrap}
  main{max-width:760px;margin:0 auto;padding:12px 12px 96px}
  .card{background:#fff;border-radius:20px;box-shadow:0 6px 24px rgba(91,42,134,.10);margin-bottom:14px;overflow:hidden}
  .card h2{margin:0;padding:12px 16px 6px;font-size:17px;color:var(--p);display:flex;align-items:center;gap:8px}
  .card h2 small{font-size:12px;color:#8a6aa0;font-weight:700;margin-inline-start:auto}
  .lesson{padding:0 16px 12px;font-size:13.5px;color:#6b5480;font-weight:700}
  /* المجسم */
  #stageWrap{position:relative;background:radial-gradient(110% 80% at 50% 25%,#fff 0%,#f7eef6 55%,#ecdcec 100%);touch-action:none}
  #stage{width:100%;height:min(62vh,520px);display:block}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #labels .lb{position:absolute;transform:translate(-50%,-130%);background:rgba(255,255,255,.95);border:1.5px solid #d7c7e6;color:var(--ink);font-weight:800;font-size:11.5px;padding:1px 8px 2px;border-radius:9px;white-space:nowrap;box-shadow:0 3px 10px rgba(42,23,64,.15);transition:opacity .15s}
  #labels .lb::after{content:"";position:absolute;left:50%;bottom:-7px;width:9px;height:9px;margin-left:-4.5px;background:var(--gold);border:1.5px solid var(--p);border-radius:50%}
  #labels .lb.sh::after{display:none}
  #hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(42,23,64,.78);color:#fff;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .5s}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--p)}
  .tools{display:flex;gap:6px;padding:10px;justify-content:center;flex-wrap:wrap;background:#fff}
  .tools button{flex:1;min-width:64px;max-width:96px;border:1.5px solid #e2d4ee;background:var(--soft);color:var(--ink);border-radius:14px;padding:6px 4px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
  .tools button span{font-size:18px;line-height:1.15}
  .tools button.on{background:var(--gold);border-color:var(--gold)}
  .info{padding:4px 16px 14px;font-size:14.5px;line-height:1.8}
  .info b{color:var(--p)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;flex-direction:column;align-items:center;width:92px;border:2px solid #eadff2;border-radius:16px;background:#fff;padding:6px 4px;cursor:pointer;font-weight:800;font-size:11.5px;color:var(--ink);text-align:center;line-height:1.3}
  .chip img{width:72px;height:56px;object-fit:contain}
  .chip.on{border-color:var(--gold);background:#fff8e1}
  .chip .tag{font-size:9.5px;color:#fff;background:var(--gr);border-radius:6px;padding:0 5px;margin-top:2px}
  .arbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 12px 12px;padding:13px;border-radius:16px;background:var(--gold);color:var(--ink);font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 6px 18px rgba(242,194,48,.35)}
  /* الصفحة */
  .page img{width:100%;display:block;border-top:1px solid #eee}
  .page a.open{display:block;text-align:center;padding:8px;font-size:13px;font-weight:800;color:var(--p);text-decoration:none}
  /* التنقل */
  nav.bar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #e9def2}
  nav.bar a{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:14px;border-radius:14px;padding:10px 6px;background:var(--soft);color:var(--ink);border:1.5px solid #e2d4ee}
  nav.bar a.mid{background:var(--p);color:#fff;border-color:var(--p)}
  nav.bar a.off{opacity:.35;pointer-events:none}
  /* فهرس الصفحات */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:12px}
  .grid a{display:block;text-decoration:none;color:var(--ink);font-weight:800;font-size:12px;text-align:center}
  .grid img{width:100%;border-radius:8px;box-shadow:0 2px 8px rgba(42,23,64,.18);display:block;margin-bottom:4px;background:#fff}
  .grid a.has img{outline:3px solid var(--gold)}
  :fullscreen #stage,:-webkit-full-screen #stage{height:100vh}
</style>
<script type="importmap">{"imports":{"three":"../../lib/three.module.js","three/addons/":"../../lib/addons/"}}</script>
</head>
<body>
<header>
  <div class="tt"><b id="hTitle">ملزمة الأحياء — السادس العلمي</b><span id="hSub">الفصل الأول: الخلية</span></div>
  <div class="pg" id="hPage">الفهرس</div>
  <div class="brand"><i></i>أثر أكاديمي<i></i></div>
</header>
<main id="main"></main>
<nav class="bar" id="nav"></nav>
<script type="module" src="app.js"></script>
</body>
</html>
